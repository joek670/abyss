# Build the static site and publish it to GitHub Pages.
#
# There is no dependency install step, because the project has no dependencies:
# the build runs the same `node scripts/build-static.mjs` a developer runs, and
# that script imports nothing outside this repository. Node 24 is required for
# the build because the catalogue module graph reaches node:sqlite through the
# database layer's imports — the physics module itself has no Node APIs at all.
#
# The site is built from SOURCE on every push rather than committing dist/,
# so the published artifact can never drift from the code that produced it.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit, not to a tag. `@v4` is a branch pointer
      # the action's own repository can move, so trusting it means trusting
      # whatever that repository points it at on the morning this workflow next
      # runs. The trailing comment is the release the commit belongs to; bump
      # both together.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      # No `npm ci` — there is no lockfile and no node_modules to install.
      - name: Build the static site
        run: node --disable-warning=ExperimentalWarning scripts/build-static.mjs

      - name: Verify the build produced a working site
        run: node --disable-warning=ExperimentalWarning scripts/test-static.mjs

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5