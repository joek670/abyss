<!doctype html>
<html lang="en" data-theme="abyss">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ABYSS — Deep-Sea Exploration Atlas</title>
<meta name="description" content="A deep-sea exploration atlas with a live dive console. Water-column physics computed from UNESCO EOS-80, Mackenzie (1981) and Beer-Lambert attenuation.">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#02060b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2304101a'/%3E%3Cpath d='M4 11h24M4 16h24M4 21h24' stroke='%234fe3d0' stroke-width='1.4' opacity='.35'/%3E%3Ccircle cx='16' cy='16' r='4.2' fill='none' stroke='%234fe3d0' stroke-width='1.6'/%3E%3Ccircle cx='16' cy='16' r='1.4' fill='%23ffb454'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/views.css">
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<!-- Fixed background field: canvas particles + depth gradient -->
<div class="water" aria-hidden="true">
  <canvas id="marine-snow"></canvas>
  <div class="water__glow"></div>
  <div class="water__rays"></div>
</div>

<!-- ── Header ─────────────────────────────────────────────────────── -->
<header class="topbar" id="topbar">
  <div class="topbar__inner">
    <a class="brand" href="#/" aria-label="ABYSS home">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="12" cy="12" r="4.2"/>
          <circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/>
          <path d="M2 8h20M2 12h5M17 12h5M2 16h20" opacity=".45"/>
        </svg>
      </span>
      <span class="brand__text">
        <span class="brand__name">ABYSS</span>
        <span class="brand__sub">Deep-Sea Atlas</span>
      </span>
    </a>

    <nav class="nav" id="nav" aria-label="Primary">
      <a href="#/" data-route="/">Surface</a>
      <a href="#/descent" data-route="/descent">Descent</a>
      <a href="#/atlas" data-route="/atlas">Atlas</a>
      <a href="#/console" data-route="/console">Console</a>
      <a href="#/log" data-route="/log">Dive Log</a>
      <a href="#/about" data-route="/about">Method</a>
      <a href="#/post" data-route="/post">Notes</a>
    </nav>

    <div class="topbar__actions">
      <button class="iconbtn" id="search-open" type="button" aria-label="Search the atlas" title="Search  (Ctrl K)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/>
        </svg>
        <span class="iconbtn__hint">Ctrl K</span>
      </button>
      <button class="iconbtn" id="theme-toggle" type="button" aria-label="Switch theme" title="Switch between abyss and daylight">
        <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
          <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/>
        </svg>
        <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
    </div>
  </div>
  <div class="topbar__progress"><span id="route-progress"></span></div>
</header>

<!-- ── Depth rail (fixed left column) ─────────────────────────────── -->
<aside class="rail" id="rail" aria-label="Depth indicator">
  <div class="rail__label">DEPTH</div>
  <div class="rail__scale" id="rail-scale">
    <div class="rail__track"></div>
    <div class="rail__zones" id="rail-zones"></div>
    <div class="rail__marker" id="rail-marker">
      <span class="rail__marker-line"></span>
      <span class="rail__marker-value" id="rail-value">0 m</span>
    </div>
  </div>
  <div class="rail__foot" id="rail-zone">Surface</div>
</aside>

<!-- ── Main ───────────────────────────────────────────────────────── -->
<main id="main" class="main" tabindex="-1">
  <div class="view" id="view">
    <div class="boot">
      <div class="boot__ring"></div>
      <p class="boot__text">Descending…</p>
    </div>
  </div>
</main>

<!-- ── Instrument strip (fixed bottom) ────────────────────────────── -->
<section class="strip" id="strip" aria-label="Water column readout">
  <div class="strip__inner">
    <div class="strip__lead">
      <span class="strip__dot" id="strip-dot"></span>
      <span class="strip__depth" id="strip-depth">0<small>m</small></span>
      <span class="strip__zone" id="strip-zone">Epipelagic</span>
    </div>
    <dl class="strip__grid" id="strip-grid">
      <div class="readout"><dt>Pressure</dt><dd id="r-pressure">—</dd></div>
      <div class="readout"><dt>Temperature</dt><dd id="r-temp">—</dd></div>
      <div class="readout"><dt>Salinity</dt><dd id="r-sal">—</dd></div>
      <div class="readout"><dt>Sound speed</dt><dd id="r-sound">—</dd></div>
      <div class="readout"><dt>Density</dt><dd id="r-density">—</dd></div>
      <div class="readout"><dt>Blue light</dt><dd id="r-light">—</dd></div>
    </dl>
    <div class="strip__tail">
      <span class="badge" id="strip-source">model</span>
    </div>
  </div>
</section>

<!-- ── Command palette ────────────────────────────────────────────── -->
<div class="palette" id="palette" hidden>
  <div class="palette__scrim" data-close></div>
  <div class="palette__panel" role="dialog" aria-modal="true" aria-label="Command palette">
    <div class="palette__field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/>
      </svg>
      <input id="palette-input" type="text" placeholder="Search species, zones, depths, commands…"
             autocomplete="off" spellcheck="false" aria-controls="palette-results" role="combobox" aria-expanded="true">
      <kbd>ESC</kbd>
    </div>
    <ul class="palette__results" id="palette-results" role="listbox" aria-label="Results"></ul>
    <div class="palette__foot">
      <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
      <span><kbd>↵</kbd> open</span>
      <span><kbd>esc</kbd> close</span>
    </div>
  </div>
</div>

<!-- ── Species drawer ─────────────────────────────────────────────── -->
<div class="drawer" id="drawer" hidden>
  <div class="drawer__scrim" data-close></div>
  <aside class="drawer__panel" role="dialog" aria-modal="true" aria-label="Specimen detail">
    <button class="drawer__close" type="button" data-close aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="drawer__body" id="drawer-body"></div>
  </aside>
</div>

<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
